spring:
  application:
    name: cine-crew

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinecrew}
    username: ${DB_USERNAME:cinecrew}
    password: ${DB_PASSWORD:cinecrew}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${SERVER_PORT:8080}

rsa:
  public-key: classpath:certs/public.key
  private-key: classpath:certs/private.key

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  invite:
    ttl-minutes: ${INVITE_TTL_MINUTES:30}
  security:
    jwt:
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: ${JWT_ISSUER:cinecrew}

springdoc:
  api-docs:
    path: /openapi

  swagger-ui:
    path: /docs
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    br.com.cinecrew: ${APP_LOG_LEVEL:DEBUG}