spring:
  application:
    name: cine-crew

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinecrew}
    username: ${DB_USERNAME:cinecrew}
    password: ${DB_PASSWORD:cinecrew}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2}

server:
  port: ${SERVER_PORT:8080}

# Propriedades próprias da aplicação (não gerenciadas pelo Spring Boot)
app:
  security:
    jwt:
      public-key-location: classpath:certs/public.pem
      private-key-location: classpath:certs/private.pem
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  invite:
    ttl-minutes: ${INVITE_TTL_MINUTES:30}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    br.com.cinecrew: ${APP_LOG_LEVEL:DEBUG}