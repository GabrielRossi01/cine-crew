services:
  postgres:
    image: postgres:16-alpine
    container_name: cinecrew-postgres
    environment:
      POSTGRES_DB: cinecrew
      POSTGRES_USER: cinecrew
      POSTGRES_PASSWORD: cinecrew
    ports:
      - "5432:5432"
    volumes:
      - cinecrew_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinecrew -d cinecrew"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cinecrew-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - cinecrew_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cinecrew_postgres_data:
  cinecrew_redis_data: